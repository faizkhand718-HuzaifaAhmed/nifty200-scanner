# Reference full-stack composition: postgres, backend, frontend.
# Redis is included but commented out (only needed once you move past the
# in-memory rate limiter / single-instance deployment - see
# backend/app/core/rate_limiter.py's module docstring).
#
# ALL secrets below are read from a local .env file (via `env_file:`), which
# is NOT committed to version control. This compose file itself contains no
# real credentials - see backend/.env.example for the full variable list.
#
# Usage:
#   cp backend/.env.example backend/.env   # then fill in real values
#   docker compose up -d --build
#   docker compose logs -f backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanner_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: nifty200_scanner
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner_user -d nifty200_scanner"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"  # bound to localhost only - never expose the DB port publicly

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt  # create this file locally, never commit it

volumes:
  postgres_data:
  # redis_data:
